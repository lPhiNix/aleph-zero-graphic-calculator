spring.application.name=alephzero

# DATASOURCE (Spring Data JPA + MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mysqldb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.sql.init.schema-locations=classpath:schema.sql

# Spring Web config
server.port=8080
server.tomcat.uri-encoding=UTF-8

# Spring Operation Cache
spring.cache.cache-names=evaluate,calculate,draw
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# Authentication (stateless JWT: short-lived access token + rotated refresh token)
app.jwt.secret=${JWT_SECRET:change-me-this-secret-must-be-at-least-32-bytes-long!!}
app.jwt.access-ttl=${JWT_ACCESS_TTL:15m}
app.jwt.refresh-ttl=${JWT_REFRESH_TTL:7d}
app.jwt.cookie-name=${JWT_COOKIE_NAME:refresh_token}
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# Frontend origin (CORS; only needed when frontend and backend are served from different origins, e.g. dev)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Exceptions and errors
server.error.include-stacktrace=never
server.error.include-exception=false
