spring.application.name=alephzero

# ---------------------------------------------------------------------------
# The whole application is configured through environment variables, all of
# them prefixed with ALEPHZERO_ so they are unambiguous for this app. They can
# be provided directly (export / docker -e) or via a .env file.
# ---------------------------------------------------------------------------

# DATASOURCE (Spring Data JPA + MySQL)
spring.datasource.url=${ALEPHZERO_DB_URL:jdbc:mysql://localhost:3306/alephzero}
spring.datasource.username=${ALEPHZERO_DB_USERNAME:root}
spring.datasource.password=${ALEPHZERO_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Database migrations (Flyway). The schema is owned exclusively by the migrations
# under classpath:db/migration; Hibernate does not touch it (ddl-auto=none).
# baseline-on-migrate adopts existing databases without a flyway_schema_history
# table: they are marked as version 2 (V1 + V2 reflect the pre-Flyway schema,
# which already included the refresh_token table) and those migrations are skipped.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.validate-on-migrate=true

# Spring Web config
server.port=${ALEPHZERO_PORT:8080}
server.tomcat.uri-encoding=UTF-8

# Spring Operation Cache
spring.cache.cache-names=evaluate,calculate,draw
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# Authentication (stateless JWT: short-lived access token + rotated refresh token)
app.jwt.secret=${ALEPHZERO_JWT_SECRET:change-me-this-secret-must-be-at-least-32-bytes-long!!}
app.jwt.access-ttl=${ALEPHZERO_JWT_ACCESS_TTL:15m}
app.jwt.refresh-ttl=${ALEPHZERO_JWT_REFRESH_TTL:7d}
app.jwt.cookie-name=${ALEPHZERO_JWT_COOKIE_NAME:refresh_token}
app.jwt.cookie-secure=${ALEPHZERO_JWT_COOKIE_SECURE:false}

# Frontend origin (CORS; only needed when frontend and backend are served from different origins, e.g. dev)
app.frontend.url=${ALEPHZERO_FRONTEND_URL:http://localhost:5173}

# OpenAPI / Swagger UI (disabled by default for production; set ALEPHZERO_SWAGGER_ENABLED=true for development)
springdoc.api-docs.enabled=${ALEPHZERO_SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${ALEPHZERO_SWAGGER_ENABLED:false}

# Exceptions and errors
server.error.include-stacktrace=never
server.error.include-exception=false
