services:
  app:
    build: .
    image: sinbelisk/alephzero:2.0.0
    container_name: alephzero
    ports:
      # Host:container. Change ALEPHZERO_PORT (e.g. in .env) to expose another port.
      - "${ALEPHZERO_PORT:-8080}:${ALEPHZERO_PORT:-8080}"
    environment:
      # Values come from the .env file when present, otherwise from the defaults.
      # See .env.example for the full, documented list of settings.
      ALEPHZERO_PORT: ${ALEPHZERO_PORT:-8080}
      ALEPHZERO_DB_URL: ${ALEPHZERO_DB_URL:-jdbc:mysql://db:3306/alephzero}
      ALEPHZERO_DB_USERNAME: ${ALEPHZERO_DB_USERNAME:-root}
      ALEPHZERO_DB_PASSWORD: ${ALEPHZERO_DB_PASSWORD:-root}
      ALEPHZERO_JWT_SECRET: ${ALEPHZERO_JWT_SECRET:-change-me-this-secret-must-be-at-least-32-bytes-long!!}
      ALEPHZERO_JWT_ACCESS_TTL: ${ALEPHZERO_JWT_ACCESS_TTL:-15m}
      ALEPHZERO_JWT_REFRESH_TTL: ${ALEPHZERO_JWT_REFRESH_TTL:-7d}
      ALEPHZERO_JWT_COOKIE_NAME: ${ALEPHZERO_JWT_COOKIE_NAME:-refresh_token}
      ALEPHZERO_JWT_COOKIE_SECURE: ${ALEPHZERO_JWT_COOKIE_SECURE:-false}
      ALEPHZERO_FRONTEND_URL: ${ALEPHZERO_FRONTEND_URL:-http://localhost}
      ALEPHZERO_SWAGGER_ENABLED: ${ALEPHZERO_SWAGGER_ENABLED:-false}
    restart: unless-stopped
    # NOTE: intentionally NO `depends_on`. The app can point at any database you
    # already have through ALEPHZERO_DB_URL; the `db` service below is optional.

  # ---------------------------------------------------------------------------
  # OPTIONAL MySQL - DEVELOPMENT ONLY.
  #
  # Provided as a convenience so you can run everything locally without
  # installing MySQL. The application does NOT depend on this service: start it
  # only if you need it and point the app at it with the following in your .env:
  #
  #     ALEPHZERO_DB_URL=jdbc:mysql://db:3306/alephzero
  #
  # If you already have a MySQL instance, ignore/remove this service and just
  # set ALEPHZERO_DB_URL to point at yours.
  # ---------------------------------------------------------------------------
  db:
    # Pinned to 8.0: Flyway 10.20.1 (bundled by Spring Boot 3.4.4) only supports MySQL up to 8.1.
    image: mysql:8.0
    container_name: alephzero-db
    environment:
      MYSQL_ROOT_PASSWORD: ${ALEPHZERO_DB_PASSWORD:-root}
      MYSQL_DATABASE: alephzero
      # Allow the root account to connect from any host (host machine, other
      # containers). Only applied on first initialization of the data volume.
      MYSQL_ROOT_HOST: '%'
    ports:
      # Exposed for convenience (e.g. connecting with a SQL client from the host).
      # Change the host port if you already run MySQL on 3306.
      - "${ALEPHZERO_DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
